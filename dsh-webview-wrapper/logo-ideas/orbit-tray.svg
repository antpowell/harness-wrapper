<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Orbit Tray logo concept">
  <defs>
    <linearGradient id="orbit-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#orbit-bg)"/>
  <!-- Browser window -->
  <rect x="136" y="152" width="240" height="176" rx="22" fill="none" stroke="#ffffff" stroke-width="20"/>
  <line x1="136" y1="200" x2="376" y2="200" stroke="#ffffff" stroke-width="20"/>
  <circle cx="176" cy="176" r="10" fill="#ffffff"/>
  <circle cx="208" cy="176" r="10" fill="#ffffff"/>
  <circle cx="240" cy="176" r="10" fill="#ffffff"/>
  <!-- Orbit ring around the window -->
  <ellipse cx="256" cy="256" rx="170" ry="70" fill="none" stroke="#22d3ee" stroke-width="14" transform="rotate(-28 256 256)" stroke-linecap="round"/>
  <!-- Orbiting tray dot -->
  <circle cx="390" cy="178" r="24" fill="#22d3ee"/>
</svg>